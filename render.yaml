services:
  - type: web
    name: asset-manager
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asset-manager-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: GMAIL_USERNAME
        sync: false
      - key: GMAIL_PASSWORD
        sync: false

databases:
  - name: asset-manager-db
    databaseName: asset_manager
    user: asset_manager
